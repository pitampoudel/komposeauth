# The whole suite runs from one client address, so the per-address abuse limits would count every
# test's sign-in against the same budget and start rejecting partway through a run. Rate limiting is
# covered by its own unit tests and by RateLimitIntegrationTest, which turns it back on deliberately.
app:
  rate-limit:
    enabled: false
  # The suite has no mail server, so every send has to fail on a timeout. Kept short so the tests
  # that assert it fails *promptly* do not spend the production window waiting.
  mail:
    timeout: 2s
