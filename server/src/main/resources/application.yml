spring:
  application:
    name: "komposeauth"
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      # Off, because what it does is re-issue every `createIndex` this codebase declares -- around
      # thirty of them -- on each context refresh, which on a scale-to-zero service means a user
      # waits through them on every cold start. MongoIndexMigration does the same work from the same
      # annotations, once per database. Set INDEX_ON_STARTUP=true to hand the job back to Spring Data.
      auto-index-creation: ${INDEX_ON_STARTUP:false}
  jmx:
    enabled: false
  lifecycle:
    # Bounds `server.shutdown: graceful` below. Cloud Run's own grace period before SIGKILL is 10
    # seconds by default, so finish inside it rather than being killed mid-drain.
    timeout-per-shutdown-phase: ${SHUTDOWN_GRACE_PERIOD:8s}
  web:
    error:
      include-exception: false
      # Framework error messages quote internal state and identifiers; keep them out of responses.
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
logging:
  level:
    root: WARN
    # Security decisions (rate-limit trips, rejected clients, failed logins) need to be visible.
    pitampoudel.komposeauth: INFO

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:24h}
  # Whether to believe X-Forwarded-* when working out the request's scheme, host and client address.
  # Correct behind a reverse proxy, which is the usual deployment and so the default. Set to `none`
  # if the server is exposed directly: there is then no proxy rewriting those headers, so anything
  # they contain came from the caller. The abuse limiter does not rely on this setting either way —
  # it runs ahead of the filter and resolves the client address itself, from app.rate-limit
  # .trusted-proxy-count below.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  # Cloud Run sends SIGTERM and then waits before killing the container. Without this the servlet
  # container drops in-flight requests at that signal, which on a scale-to-zero service is a routine
  # event rather than a rare one: every idle timeout and every revision rollout ends this way.
  shutdown: graceful
  tomcat:
    threads:
      # A Cloud Run instance is one or two vCPUs serving at most `--concurrency` requests at a time.
      # Tomcat's default 200 workers size a pool for a much larger machine; each is a platform thread
      # with its own stack, so the default costs memory and startup work that this container never
      # gets to use. Keep the ceiling near the concurrency setting the service is deployed with.
      max: ${TOMCAT_MAX_THREADS:40}
      # Started eagerly, while Cloud Run's startup CPU boost is still in effect, so the first
      # requests after a cold start do not each pay to create their own worker.
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}

app:
  base64-encryption-key: ${BASE64_ENCRYPTION_KEY}
  rate-limit:
    # Number of reverse proxies you run in front of this server, counted in from the right-hand end
    # of X-Forwarded-For. 0 means it is reached directly and no forwarded header is believed — the
    # only safe default, since that header is sent by the caller and, taken at face value, lets
    # anyone give themselves a fresh rate-limit budget per request. Behind one proxy that appends to
    # the header (nginx, a cloud load balancer, Cloud Run) set this to 1.
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}
    # Alternative for platforms whose edge replaces the forwarded header and publishes the client
    # address under one of its own: X-Envoy-External-Address on Railway, Fly-Client-IP on Fly,
    # CF-Connecting-IP behind Cloudflare. Set it and the value is used as-is, no hop counting.
    # Only name a header your own edge writes — one it does not overwrite is just the caller talking.
    client-ip-header: ${CLIENT_IP_HEADER:}

management:
  endpoints:
    web:
      exposure:
        # Health only. The rest of actuator reports configuration, environment and beans, and this
        # server holds provider secrets; it is also reachable on the same port as everything else,
        # because Cloud Run routes exactly one.
        include: health
  endpoint:
    health:
      # Status alone, to no-one in particular: the readiness path is unauthenticated so that Cloud
      # Run's startup probe can reach it, and component detail would then be public too.
      show-details: never
      show-components: never
      probes:
        # Splits health into /actuator/health/liveness and /actuator/health/readiness. Readiness is
        # the one worth probing: it reports ACCEPTING_TRAFFIC only after ApplicationReadyEvent, which
        # is to say after the migration runner and the Sentry/app-config warm-up have finished. The
        # servlet container binds its port well before that, so the TCP probe Cloud Run uses by
        # default goes green while the instance still cannot serve anything.
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # A cold start must not be held up by a round trip to the mail server, and mail being down is
    # not a reason for Cloud Run to replace an instance that can still sign people in.
    mail:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false