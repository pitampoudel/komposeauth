spring:
  application:
    name: "komposeauth"
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
  jmx:
    enabled: false
  web:
    error:
      include-exception: false
      # Framework error messages quote internal state and identifiers; keep them out of responses.
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
logging:
  level:
    root: WARN
    # Security decisions (rate-limit trips, rejected clients, failed logins) need to be visible.
    pitampoudel.komposeauth: INFO

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  base64-encryption-key: ${BASE64_ENCRYPTION_KEY}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false