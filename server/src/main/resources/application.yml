spring:
  application:
    name: "komposeauth"
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true
  jmx:
    enabled: false
  web:
    error:
      include-exception: false
      # Framework error messages quote internal state and identifiers; keep them out of responses.
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
logging:
  level:
    root: WARN
    # Security decisions (rate-limit trips, rejected clients, failed logins) need to be visible.
    pitampoudel.komposeauth: INFO

server:
  port: ${PORT:8080}
  servlet:
    session:
      # How long a browser session may sit idle before the store discards it.
      #
      # This is not only how long somebody stays signed in — it is also the window a sign-in has to
      # complete in. Sending a visitor to Google leaves the authorization request in their session,
      # and if the session is gone by the time they come back there is nothing here to match the
      # callback against, so the sign-in fails outright. The framework default of 30 minutes is
      # under the time somebody plausibly spends picking an account, finding a phone for a second
      # factor, or leaving the tab while they do something else.
      #
      # Shorten it if sessions on shared machines are the bigger worry; the cookie carrying the
      # session is dropped when the browser closes either way.
      timeout: ${SESSION_TIMEOUT:24h}
  # Whether to believe X-Forwarded-* when working out the request's scheme, host and client address.
  # Correct behind a reverse proxy, which is the usual deployment and so the default. Set to `none`
  # if the server is exposed directly: there is then no proxy rewriting those headers, so anything
  # they contain came from the caller. The abuse limiter does not rely on this setting either way —
  # it runs ahead of the filter and resolves the client address itself, from app.rate-limit
  # .trusted-proxy-count below.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

app:
  base64-encryption-key: ${BASE64_ENCRYPTION_KEY}
  rate-limit:
    # Number of reverse proxies you run in front of this server, counted in from the right-hand end
    # of X-Forwarded-For. 0 means it is reached directly and no forwarded header is believed — the
    # only safe default, since that header is sent by the caller and, taken at face value, lets
    # anyone give themselves a fresh rate-limit budget per request. Behind one proxy that appends to
    # the header (nginx, a cloud load balancer, Cloud Run) set this to 1.
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}
    # Alternative for platforms whose edge replaces the forwarded header and publishes the client
    # address under one of its own: X-Envoy-External-Address on Railway, Fly-Client-IP on Fly,
    # CF-Connecting-IP behind Cloudflare. Set it and the value is used as-is, no hop counting.
    # Only name a header your own edge writes — one it does not overwrite is just the caller talking.
    client-ip-header: ${CLIENT_IP_HEADER:}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false