<!DOCTYPE html>
<html th:replace="~{admin/layout :: page(~{::title}, 'users', ~{::style}, ~{::main}, ~{::script})}"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${appName.isEmpty()} ? 'People · Admin' : ${appName} + ' · People'">People</title>
    <style>
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }

        .toolbar input[type=search] { flex: 1 1 240px; }

        .row-roles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }

        #status { margin-top: 18px; }

        .list-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 18px;
            font-size: 13px;
            color: var(--muted);
        }

        .role-option { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; }

        .role-option + .role-option { border-top: 1px solid var(--divider); }

        .role-option input[type=checkbox] {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: var(--brand);
            cursor: pointer;
        }

        .role-option input[type=checkbox]:disabled { cursor: not-allowed; opacity: 0.5; }

        /* Held for the length of one request. Enough to read as busy, not enough to look disabled. */
        .role-option.is-saving { opacity: 0.6; }

        .role-option-body { min-width: 0; flex: 1; }

        .role-option-name { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }

        .role-option-why { margin-top: 3px; font-size: 12.5px; color: var(--muted); }

        @media (max-width: 620px) {
            .row { flex-wrap: wrap; }
            .row-roles { justify-content: flex-start; width: 100%; padding-left: 52px; }
        }
    </style>
</head>
<body>

<main>
    <p class="eyebrow">Access</p>
    <h1 class="font-display">People and roles</h1>

    <section>
        <div class="section-head">
            <h2>Roles</h2>
            <a id="catalogHint" class="section-hint inline-link hidden" href="/admin/config">Add a role</a>
        </div>
        <div id="roleChips" class="chips" role="group" aria-label="Filter people by role"></div>
    </section>

    <section>
        <div class="section-head">
            <h2>People</h2>
            <span id="peopleCount" class="section-hint"></span>
        </div>

        <div class="toolbar">
            <label for="search" class="sr-only">Search people</label>
            <input id="search" type="search" placeholder="Search by name, email or phone" autocomplete="off"/>
            <button id="clearFilters" class="btn btn-ghost btn-sm hidden" type="button">Clear</button>
        </div>

        <div id="status" class="hidden" role="status" aria-live="polite"></div>

        <div id="rows" class="rows" aria-busy="false"></div>

        <div id="empty" class="empty hidden">
            <h3 id="emptyTitle">No one matches that</h3>
            <p id="emptyBody">Try a different name, email or phone number.</p>
            <button id="emptyClear" class="btn btn-secondary btn-sm" type="button">Clear search</button>
        </div>

        <div class="list-foot">
            <span id="shown"></span>
            <button id="loadMore" class="btn btn-secondary btn-sm hidden" type="button">Show more</button>
        </div>
    </section>

    <dialog id="rolesDialog" aria-labelledby="dialogTitle">
        <div class="dialog-head">
            <div id="dialogTitle" class="dialog-title">Manage roles</div>
            <div id="dialogSub" class="dialog-sub"></div>
        </div>

        <div id="dialogStatus" class="alert alert-error hidden" role="alert" style="margin-top:14px;"></div>

        <div id="roleOptions"></div>

        <div class="dialog-foot">
            <button id="dialogDone" class="btn btn-secondary btn-sm" type="button">Done</button>
        </div>
    </dialog>
</main>

<script th:inline="javascript">
    /*<![CDATA[*/
    const VIEWER_ROLES = /*[[${viewerRoles}]]*/ [];
    /*]]>*/

    const PAGE_SIZE = 25;
    const SUPER_ADMIN = "SUPER_ADMIN";

    const state = {
        roles: [],          // [{role, userCount, builtIn}]
        totalUsers: 0,
        role: null,         // active role filter
        query: "",
        page: 0,
        loaded: [],         // users accumulated across pages
        totalItems: 0,
        hasNext: false,
        target: null        // user open in the dialog
    };

    const el = {
        roleChips: document.getElementById("roleChips"),
        catalogHint: document.getElementById("catalogHint"),
        peopleCount: document.getElementById("peopleCount"),
        search: document.getElementById("search"),
        clearFilters: document.getElementById("clearFilters"),
        status: document.getElementById("status"),
        rows: document.getElementById("rows"),
        empty: document.getElementById("empty"),
        emptyTitle: document.getElementById("emptyTitle"),
        emptyBody: document.getElementById("emptyBody"),
        emptyClear: document.getElementById("emptyClear"),
        shown: document.getElementById("shown"),
        loadMore: document.getElementById("loadMore"),
        dialog: document.getElementById("rolesDialog"),
        dialogTitle: document.getElementById("dialogTitle"),
        dialogSub: document.getElementById("dialogSub"),
        dialogStatus: document.getElementById("dialogStatus"),
        roleOptions: document.getElementById("roleOptions"),
        dialogDone: document.getElementById("dialogDone")
    };

    function plural(n, one, many) {
        return n === 1 ? one : many;
    }

    function showStatus(kind, text) {
        el.status.textContent = text;
        el.status.className = "alert alert-" + kind;
    }

    function hideStatus() {
        el.status.className = "hidden";
    }

    function displayName(user) {
        const name = [user.firstName, user.lastName].filter(Boolean).join(" ").trim();
        return name || user.email || user.phoneNumber || "Unnamed person";
    }

    function initial(user) {
        const source = displayName(user);
        return source && source !== "Unnamed person" ? source.trim().charAt(0) : "?";
    }

    function contact(user) {
        return [user.email, user.phoneNumber].filter(Boolean).join(" · ") || "No contact details";
    }

    // ---- roles catalog -------------------------------------------------------

    async function loadRoles() {
        const res = await fetch("/roles", {credentials: "same-origin", headers: {Accept: "application/json"}});
        if (!res.ok) {
            showStatus("error", await problemText(res, "Couldn't load the roles. Reload the page to try again."));
            return;
        }
        state.roles = await res.json();
        renderRoleChips();
    }

    function renderRoleChips() {
        const everyone = `
            <button class="chip" type="button" data-role="" aria-pressed="${state.role === null}">
                Everyone
            </button>`;

        const chips = state.roles.map(r => {
            const share = state.totalUsers > 0
                ? `${r.userCount} of ${state.totalUsers} ${plural(state.totalUsers, "person", "people")}`
                : `${r.userCount} ${plural(r.userCount, "person", "people")}`;
            return `
                <button class="chip" type="button" data-role="${escapeHtml(r.role)}" aria-pressed="${state.role === r.role}">
                    ${escapeHtml(r.role)}<span class="share">${escapeHtml(share)}</span>
                </button>`;
        }).join("");

        el.roleChips.innerHTML = everyone + chips;
        el.roleChips.querySelectorAll(".chip").forEach(chip => {
            chip.addEventListener("click", () => {
                const role = chip.dataset.role || null;
                state.role = state.role === role ? null : role;
                resetAndLoad();
            });
        });

        el.catalogHint.classList.toggle("hidden", state.roles.some(r => !r.builtIn));
    }

    // ---- people --------------------------------------------------------------

    function resetAndLoad() {
        state.page = 0;
        state.loaded = [];
        loadUsers();
    }

    /**
     * Re-runs the current query from the top, keeping however far the reader had paged in.
     *
     * Used after a role changes, where patching the cached row in place is not enough: the list on
     * screen is the answer to a question ("who holds ADMIN?") that the change may have altered. Edit
     * the cache instead and a person keeps their place in a filter they no longer match, above a
     * total that no longer counts them.
     */
    async function reloadCurrentView() {
        const pages = state.page;
        state.page = 0;
        state.loaded = [];
        for (let p = 0; p <= pages; p++) {
            state.page = p;
            await loadUsers({render: p === pages});
            if (!state.hasNext) break;
        }
    }

    async function loadUsers(options) {
        const render = !options || options.render !== false;
        el.rows.setAttribute("aria-busy", "true");
        const params = new URLSearchParams({page: String(state.page), size: String(PAGE_SIZE)});
        if (state.query) params.set("q", state.query);
        if (state.role) params.set("role", state.role);

        const res = await fetch("/users?" + params.toString(), {
            credentials: "same-origin",
            headers: {Accept: "application/json"}
        });
        el.rows.setAttribute("aria-busy", "false");

        if (!res.ok) {
            showStatus("error", await problemText(res, "Couldn't load people. Reload the page to try again."));
            return;
        }
        hideStatus();

        const page = await res.json();
        state.loaded = state.page === 0 ? page.items : state.loaded.concat(page.items);
        state.totalItems = page.totalItems;
        state.hasNext = page.hasNext;

        // The unfiltered total is the denominator every role share is measured against.
        if (!state.role && !state.query) {
            state.totalUsers = page.totalItems;
            renderRoleChips();
        }

        if (render) renderRows();
    }

    function renderRows() {
        const filtering = Boolean(state.role || state.query);
        el.clearFilters.classList.toggle("hidden", !filtering);

        el.peopleCount.textContent = state.totalUsers > 0
            ? `${state.totalUsers} ${plural(state.totalUsers, "person", "people")} in total`
            : "";

        if (!state.loaded.length) {
            el.rows.innerHTML = "";
            el.shown.textContent = "";
            el.loadMore.classList.add("hidden");
            el.empty.classList.remove("hidden");
            if (filtering) {
                el.emptyTitle.textContent = state.role
                    ? `Nobody holds ${state.role} yet`
                    : "No one matches that";
                el.emptyBody.textContent = state.role ? "" : "Try a different name, email or phone number.";
                el.emptyClear.classList.remove("hidden");
            } else {
                el.emptyTitle.textContent = "No one has signed in yet";
                el.emptyBody.textContent = "";
                el.emptyClear.classList.add("hidden");
            }
            return;
        }

        el.empty.classList.add("hidden");

        el.rows.innerHTML = state.loaded.map(user => {
            const roles = (user.roles || []).length
                ? user.roles.map(r => `<span class="badge badge-brand">${escapeHtml(r)}</span>`).join("")
                : `<span class="badge badge-none">No role</span>`;
            return `
                <div class="row">
                    <div class="avatar" aria-hidden="true">${escapeHtml(initial(user))}</div>
                    <div class="row-main">
                        <div class="row-name">${escapeHtml(displayName(user))}</div>
                        <div class="row-sub">${escapeHtml(contact(user))}</div>
                    </div>
                    <div class="row-roles">${roles}</div>
                    <button class="btn btn-secondary btn-xs manage" type="button" data-id="${escapeHtml(user.id)}">
                        Manage<span class="sr-only"> roles for ${escapeHtml(displayName(user))}</span>
                    </button>
                </div>`;
        }).join("");

        el.rows.querySelectorAll(".manage").forEach(btn => {
            btn.addEventListener("click", () => {
                openDialog(state.loaded.find(u => u.id === btn.dataset.id));
            });
        });

        el.shown.textContent = `Showing ${state.loaded.length} of ${state.totalItems}`;
        el.loadMore.classList.toggle("hidden", !state.hasNext);
    }

    // ---- manage roles --------------------------------------------------------

    function openDialog(user) {
        if (!user) return;
        state.target = user;
        el.dialogTitle.textContent = displayName(user);
        el.dialogSub.textContent = contact(user);
        el.dialogStatus.className = "alert alert-error hidden";
        renderRoleOptions();
        el.dialog.showModal();
    }

    /**
     * Every rule the server enforces is shown here as a disabled control with the reason, so a
     * click never fails for something the page already knew.
     */
    function optionBlockedReason(role, held) {
        if (role.role === SUPER_ADMIN && !VIEWER_ROLES.includes(SUPER_ADMIN)) {
            return `Only a ${SUPER_ADMIN} can give out ${SUPER_ADMIN}.`;
        }
        if (held && role.builtIn && role.userCount <= 1) {
            return `This is the last ${role.role}. Give it to someone else first.`;
        }
        return null;
    }

    /** Built once when the dialog opens. Afterwards only [syncRoleOptions] touches it. */
    function renderRoleOptions() {
        el.roleOptions.innerHTML = state.roles.map(role => `
                <label class="role-option" data-role-row="${escapeHtml(role.role)}">
                    <input type="checkbox" data-role="${escapeHtml(role.role)}"/>
                    <span class="role-option-body">
                        <span class="role-option-name">
                            ${escapeHtml(role.role)}
                            ${role.builtIn ? '<span class="badge">Built in</span>' : ""}
                        </span>
                        <span class="role-option-why"></span>
                    </span>
                </label>`).join("");

        el.roleOptions.querySelectorAll("input[type=checkbox]").forEach(box => {
            box.addEventListener("change", () => toggleRole(box));
        });
        syncRoleOptions();
    }

    /**
     * Brings the options up to date without replacing them.
     *
     * Rebuilding the markup here is what made a click feel ignored: the element under the pointer
     * was thrown away and replaced by one built from state that had not caught up yet, so the tick
     * the browser had already drawn vanished and came back a round trip later. Writing to the nodes
     * that are already there leaves the control the reader is touching alone.
     *
     * @param skipRole the checkbox mid-flight, whose position is the reader's and not ours to set.
     */
    function syncRoleOptions(skipRole) {
        const held = state.target.roles || [];

        state.roles.forEach(role => {
            const row = el.roleOptions.querySelector(`[data-role-row="${CSS.escape(role.role)}"]`);
            if (!row) return;
            const box = row.querySelector("input[type=checkbox]");
            const on = held.includes(role.role);
            const blocked = optionBlockedReason(role, on);

            if (role.role !== skipRole) {
                box.checked = on;
                box.disabled = Boolean(blocked);
            }
            row.querySelector(".role-option-why").textContent = blocked
                ? blocked
                : `${role.userCount} ${plural(role.userCount, "person holds", "people hold")} this`;
        });
    }

    async function toggleRole(box) {
        const role = box.dataset.role;
        const grant = box.checked;

        // The browser has already drawn the tick, and that is the feedback. Nothing here undoes it
        // unless the server refuses. Only this one control is held, and only against a second click
        // landing before the first has been answered — disabling the whole list made every toggle
        // look like the dialog had frozen.
        box.disabled = true;
        box.closest(".role-option").classList.add("is-saving");
        el.dialogStatus.className = "alert alert-error hidden";

        try {
            const res = await fetch(`/users/${encodeURIComponent(state.target.id)}/roles/${encodeURIComponent(role)}`, {
                method: grant ? "POST" : "DELETE",
                credentials: "same-origin",
                headers: csrfHeaders({Accept: "application/json"})
            });

            if (!res.ok) {
                box.checked = !grant;
                el.dialogStatus.textContent = await problemText(
                    res,
                    grant ? "Couldn't give that role. Try again." : "Couldn't remove that role. Try again."
                );
                el.dialogStatus.className = "alert alert-error";
                return;
            }

            state.target = await res.json();
            syncRoleOptions(role);

            // The counts and the list behind the dialog have moved too, but nobody is waiting on
            // them: they are refreshed without the dialog holding still for the round trips.
            refreshBehindDialog();
        } catch (_) {
            box.checked = !grant;
            el.dialogStatus.textContent = "No connection. Check your network and try again.";
            el.dialogStatus.className = "alert alert-error";
        } finally {
            box.disabled = false;
            box.closest(".role-option").classList.remove("is-saving");
        }
    }

    /**
     * Catches the page up after a role changes: the catalog counts, and the list itself — which
     * under a role filter is what takes a person out of a list they no longer belong in.
     *
     * Deliberately not awaited by the caller. When it lands, the dialog's counts are brought up to
     * date in place if it is still open.
     */
    function refreshBehindDialog() {
        return loadRoles()
            .then(reloadCurrentView)
            .then(() => {
                if (el.dialog.open) syncRoleOptions();
            })
            .catch(() => {
                // The role change itself succeeded and has already been reflected; a failure to
                // re-read the list is reported by whichever loader hit it.
            });
    }

    // ---- wiring --------------------------------------------------------------

    let searchTimer;
    el.search.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            state.query = el.search.value.trim();
            resetAndLoad();
        }, 250);
    });

    function clearFilters() {
        el.search.value = "";
        state.query = "";
        state.role = null;
        renderRoleChips();
        resetAndLoad();
    }

    el.clearFilters.addEventListener("click", clearFilters);
    el.emptyClear.addEventListener("click", clearFilters);

    el.loadMore.addEventListener("click", () => {
        state.page += 1;
        loadUsers();
    });

    el.dialogDone.addEventListener("click", () => el.dialog.close());

    (async function init() {
        await loadUsers();
        await loadRoles();
    })();
</script>
</body>
</html>
