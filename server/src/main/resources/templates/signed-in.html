<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${appName.isEmpty()} ? 'Signed in' : 'Signed in · ' + ${appName}">Signed in</title>
    <style th:inline="css">
        :root {
            --brand: /*[(${brandColor})]*/ #3458d4;
            --on-brand: #ffffff;

            --background: #f6f8fc;
            --foreground: #141e32;
            --surface-soft: #e9eef9;
            --muted: #4c5a72;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #0a1020;
                --foreground: #e7ebf6;
                --surface-soft: #1a2540;
                --muted: #aab8d2;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            /* Same airy, flat depth as the sign-in page: tinted light, no shadows or panel edges. */
            background:
                radial-gradient(circle at 8% 0%, color-mix(in oklab, var(--brand) 7%, transparent), transparent 46%),
                radial-gradient(circle at 100% 10%, color-mix(in oklab, var(--brand) 5%, transparent), transparent 44%),
                var(--background);
            color: var(--foreground);
            font-family: "Space Grotesk", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 40px 20px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .logo-img, .logo-mark {
            width: 48px;
            height: 48px;
            border-radius: 16px;
        }

        .logo-img { object-fit: cover; }

        .logo-mark {
            background: color-mix(in oklab, var(--brand) 12%, transparent);
            color: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        .heading {
            font-family: Fraunces, "Iowan Old Style", Georgia, serif;
            font-size: 28px;
            line-height: 1.15;
            letter-spacing: -0.01em;
        }

        .who {
            font-size: 14px;
            color: var(--muted);
            max-width: 34rem;
        }

        .account {
            font-size: 14px;
            font-weight: 600;
            background: color-mix(in oklab, var(--surface-soft) 60%, transparent);
            border-radius: 999px;
            padding: 8px 16px;
        }
    </style>
</head>
<body>

<img th:if="${!logoUrl.isEmpty()}" th:src="${logoUrl}" class="logo-img" alt=""/>
<span th:unless="${!logoUrl.isEmpty()}" class="logo-mark"
      th:text="${appName.isEmpty() ? '' : appName.substring(0,1).toUpperCase()}"></span>

<h1 class="heading">You're signed in</h1>

<p class="account" th:if="${!account.isEmpty()}" th:text="${account}"></p>

<p class="who"
   th:text="${appName.isEmpty()}
        ? 'There is nothing waiting for you here — this page signs you in to other applications. Head back to the app you came from.'
        : 'There is nothing waiting for you here — ' + ${appName} + ' signs you in to other applications. Head back to the app you came from.'">
</p>

</body>
</html>
