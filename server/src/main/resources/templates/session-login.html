<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${appName.isEmpty()} ? 'Sign in' : 'Sign in · ' + ${appName}">Sign in</title>
    <style th:inline="css">
        :root {
            --brand: /*[(${brandColor})]*/ #3458d4;
            --brand-strong: color-mix(in oklab, var(--brand) 82%, #000);
            --on-brand: #ffffff;

            --background: #f6f8fc;
            --foreground: #141e32;
            --surface: #ffffff;
            --surface-soft: #e9eef9;
            --muted: #4c5a72;
            --divider: color-mix(in oklab, var(--foreground) 10%, transparent);

            --danger-bg: color-mix(in oklab, #ef4444 10%, transparent);
            --danger-text: #dc2626;
            --ok-bg: color-mix(in oklab, #12c07e 12%, transparent);
            --ok-text: #077a4f;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --brand-strong: color-mix(in oklab, var(--brand) 78%, #fff);

                --background: #0a1020;
                --foreground: #e7ebf6;
                --surface: #121b31;
                --surface-soft: #1a2540;
                --muted: #aab8d2;
                --divider: color-mix(in oklab, var(--foreground) 14%, transparent);

                --danger-text: #f87171;
                --ok-text: #7dffc8;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            /* Airy, flat depth: tinted light instead of shadows or panel edges. */
            background:
                radial-gradient(circle at 8% 0%, color-mix(in oklab, var(--brand) 7%, transparent), transparent 46%),
                radial-gradient(circle at 100% 10%, color-mix(in oklab, var(--brand) 5%, transparent), transparent 44%),
                linear-gradient(180deg, color-mix(in oklab, var(--surface-soft) 40%, transparent), transparent 480px),
                var(--background);
            color: var(--foreground);
            font-family: "Space Grotesk", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .card {
            width: 100%;
            max-width: 380px;
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: none; }
        }

        .logo { display: flex; justify-content: center; margin-bottom: 24px; }

        .logo-img {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            object-fit: cover;
        }

        .logo-mark {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: color-mix(in oklab, var(--brand) 12%, transparent);
            color: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        /* Display headings use Fraunces where it's installed, then a serif fallback — an auth page
           shouldn't call a third-party font host on every view. */
        .heading {
            font-family: Fraunces, "Iowan Old Style", Georgia, serif;
            font-size: 30px;
            line-height: 1.15;
            letter-spacing: -0.01em;
            text-align: center;
            margin-bottom: 8px;
        }

        .subheading {
            font-size: 14px;
            line-height: 1.6;
            color: var(--muted);
            text-align: center;
            margin-bottom: 28px;
        }

        .field { margin-bottom: 16px; }

        .field-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--foreground);
            margin-bottom: 6px;
        }

        .field-row label { margin-bottom: 0; }

        .input-wrap { position: relative; }

        input[type=text],
        input[type=password],
        input[type=email] {
            width: 100%;
            height: 48px;
            font-size: 15px;
            font-family: inherit;
            color: var(--foreground);
            background: color-mix(in oklab, var(--surface-soft) 55%, transparent);
            border: none;
            border-radius: 16px;
            padding: 0 16px;
            outline: none;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .input-wrap input { padding-right: 68px; }

        input::placeholder { color: var(--muted); opacity: 0.7; }

        input:hover { background: var(--surface-soft); }

        input:focus-visible {
            background: var(--surface-soft);
            box-shadow: 0 0 0 2px color-mix(in oklab, var(--brand) 50%, transparent);
        }

        /* Preserve field styling through browser autofill */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--foreground);
            -webkit-box-shadow: 0 0 0 1000px var(--surface-soft) inset;
            caret-color: var(--foreground);
            transition: background-color 9999s ease-out 0s;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            white-space: nowrap;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .btn:disabled { cursor: not-allowed; opacity: 0.5; }

        .btn-primary {
            margin-top: 22px;
            background: var(--brand);
            color: var(--on-brand);
        }

        .btn-primary:hover:not(:disabled) { background: var(--brand-strong); }

        .btn-alt {
            background: color-mix(in oklab, var(--surface-soft) 60%, transparent);
            color: var(--foreground);
        }

        .btn-alt:hover { background: var(--surface-soft); }

        .link-btn {
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            color: var(--brand);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            border-radius: 8px;
        }

        .link-btn:hover { color: var(--brand-strong); }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--muted);
            font-size: 12px;
            margin: 20px 0;
        }

        /* The one sanctioned line: a faint divider, not a panel edge. */
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--divider);
        }

        .google-icon { width: 18px; height: 18px; flex-shrink: 0; }

        .alert {
            font-size: 13px;
            line-height: 1.5;
            border-radius: 16px;
            padding: 12px 15px;
            margin-bottom: 20px;
        }

        .alert-error { color: var(--danger-text); background: var(--danger-bg); }

        .alert-success { color: var(--ok-text); background: var(--ok-bg); }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            background: none;
            border: none;
            padding: 0;
            margin-bottom: 20px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 8px;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--foreground); }

        .footer {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--muted);
        }

        .footer svg { flex-shrink: 0; }

        .hidden { display: none; }

        .view { display: none; }
        .view.active { display: block; }

        :focus-visible {
            outline: 2px solid color-mix(in oklab, var(--brand) 50%, transparent);
            outline-offset: 2px;
        }

        input:focus-visible { outline: none; }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
<div class="card">

    <div class="logo">
        <img th:if="${!logoUrl.isEmpty()}" th:src="${logoUrl}" class="logo-img" alt=""/>
        <span th:unless="${!logoUrl.isEmpty()}" class="logo-mark"
              th:text="${appName.isEmpty() ? '' : appName.substring(0,1).toUpperCase()}"></span>
    </div>

    <!-- Login view -->
    <div id="view-login" class="view active">
        <h1 class="heading">Welcome back</h1>
        <p class="subheading"
           th:text="${appName.isEmpty()} ? 'Sign in to continue to your account' : 'Sign in to continue to ' + ${appName}">
            Sign in to continue to your account
        </p>

        <p th:if="${error}" class="alert alert-error" role="alert" aria-live="assertive" th:text="${error}"></p>

        <form id="login-form" th:action="@{/session-login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>

            <div class="field">
                <label for="username">Email or phone</label>
                <input id="username" type="text" name="username" autocomplete="username"
                       placeholder="you@example.com" required autofocus/>
            </div>

            <div class="field">
                <div class="field-row">
                    <label for="password">Password</label>
                    <button type="button" class="link-btn" onclick="showView('forgot')">Forgot password?</button>
                </div>
                <div class="input-wrap">
                    <input id="password" type="password" name="password" autocomplete="current-password"
                           placeholder="Enter your password" required/>
                    <button type="button" id="toggle-pw" class="link-btn toggle-pw" onclick="togglePassword(this)"
                            aria-label="Show password" aria-pressed="false"
                            style="position:absolute;top:0;right:16px;height:48px;color:var(--muted);">Show</button>
                </div>
            </div>

            <button id="login-btn" class="btn btn-primary" type="submit">Sign in</button>
        </form>

        <div th:if="${googleEnabled}" class="divider">or</div>

        <a th:if="${googleEnabled}" class="btn btn-alt" href="/oauth2/authorization/google">
            <svg class="google-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
        </a>
    </div>

    <!-- Forgot password view -->
    <div id="view-forgot" class="view">
        <button type="button" class="back-link" onclick="showView('login')">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back to sign in
        </button>

        <h1 class="heading">Reset your password</h1>
        <p class="subheading">Enter your email and we'll send you a link to set a new one.</p>

        <div id="forgot-status" class="hidden" role="status" aria-live="polite"></div>

        <form id="forgot-form">
            <div class="field">
                <label for="reset-email">Email address</label>
                <input id="reset-email" type="email" name="email" autocomplete="email"
                       placeholder="you@example.com" required/>
            </div>

            <button id="forgot-btn" class="btn btn-primary" type="submit">Send reset link</button>
        </form>
    </div>

</div>

<div class="footer">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 10V8a6 6 0 0 1 12 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="4" y="10" width="16" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
    </svg>
    Secure sign-in
</div>

<script>
    function togglePassword(btn) {
        const input = document.getElementById('password');
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Hide' : 'Show';
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    }

    const loginBtn = document.getElementById('login-btn');

    document.getElementById('login-form').addEventListener('submit', function () {
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in…';
    });

    // Coming back via the back button restores the DOM as it was left, which would strand the
    // button disabled and lock the user out of retrying.
    window.addEventListener('pageshow', function () {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign in';
    });

    function showView(name) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + name).classList.add('active');
        if (name === 'forgot') {
            document.getElementById('reset-email').value = '';
            document.getElementById('forgot-status').className = 'hidden';
            document.getElementById('forgot-form').style.display = '';
            document.getElementById('reset-email').focus();
        } else {
            document.getElementById('username').focus();
        }
    }

    document.getElementById('forgot-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = document.getElementById('reset-email').value.trim();
        const btn = document.getElementById('forgot-btn');
        const statusEl = document.getElementById('forgot-status');

        btn.disabled = true;
        btn.textContent = 'Sending…';
        statusEl.className = 'hidden';

        try {
            const res = await fetch('/reset-password?email=' + encodeURIComponent(email), {
                method: 'PUT',
                headers: { 'Accept': 'application/json' }
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok) {
                statusEl.textContent = data.message || 'If that address has an account, a reset link is on its way.';
                statusEl.className = 'alert alert-success';
                document.getElementById('forgot-form').style.display = 'none';
            } else {
                statusEl.textContent = data.detail || data.message || 'We couldn\'t send that link. Try again in a moment.';
                statusEl.className = 'alert alert-error';
            }
        } catch (_) {
            statusEl.textContent = 'No connection. Check your network and try again.';
            statusEl.className = 'alert alert-error';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Send reset link';
        }
    });
</script>
</body>
</html>
