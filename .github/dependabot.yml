# Weekly, grouped, so a dependency bump is one pull request to read rather than dozens.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Each of these failed the server's tests; see the comments in server/build.gradle.kts.
    ignore:
      - dependency-name: org.springframework.boot
        versions: [">= 4.1"]
      - dependency-name: org.jetbrains.kotlinx:kotlinx-coroutines-*
        versions: [">= 1.11"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
