name: Publish Docker Image

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests with parallel execution
        run: ./gradlew clean :server:check --parallel --build-cache --no-daemon

  build-and-push:
    name: Build and Push Image (Buildpacks)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/komposeauth
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Spring Boot builds and pushes every tag itself, signed in through the login above.
      - name: Build image with Buildpacks and push tags
        if: steps.meta.outputs.tags != ''
        env:
          IMAGE_NAME: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          IMAGE_TAGS: ${{ join(fromJSON(steps.meta.outputs.json).tags, ',') }}
        run: ./gradlew :server:bootBuildImage --publishImage --imageName="$IMAGE_NAME" -PimageTags="$IMAGE_TAGS" --no-daemon
