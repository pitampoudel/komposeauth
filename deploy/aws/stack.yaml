AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  komposeauth on AWS: the Docker Hub image on ECS Fargate behind a load balancer.
  Created and updated by deploy/aws/setup.sh; see deploy/aws/README.md.

Parameters:
  ServiceName:
    Type: String
    Default: komposeauth
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      At least two public subnets in different zones. The load balancer and the tasks share them,
      and a task gets a public address so it can reach MongoDB, Google and the mail provider
      without a NAT gateway.
  CertificateArn:
    Type: String
    Description: ACM certificate for the domain the server answers on, in this region.
  AppSecretArn:
    Type: String
    Description: A Secrets Manager secret holding JSON with MONGODB_URI and BASE64_ENCRYPTION_KEY.
  Issuer:
    Type: String
    Description: >-
      The server's public address exactly as clients validate it, e.g. https://auth.example.com
      (no trailing slash). Emailed links and the discovery document are built from it.
  ImageUri:
    Type: String
    Default: docker.io/pitampoudel/komposeauth:latest
    Description: A tag pinned to a release is safer than latest, which moves under a running service.
  FilesBucketName:
    Type: String
    Default: ''
    Description: >-
      An S3 bucket set as s3BucketName in the admin config. The tasks get access to it through their
      role, so s3AccessKeyId and s3SecretAccessKey can stay blank there. Empty grants nothing.
  Cpu:
    Type: Number
    Default: 512
  Memory:
    Type: Number
    Default: 1024
  MinTasks:
    Type: Number
    Default: 1
  MaxTasks:
    Type: Number
    Default: 3
  AlertEmail:
    Type: String
    Default: ''
    Description: >-
      Where the alarms email. Empty creates none. AWS emails the address once to confirm the
      subscription before anything is delivered.

Conditions:
  HasBucket: !Not [!Equals [!Ref FilesBucketName, '']]
  HasAlerts: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ServiceName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ServiceName}
      RetentionInDays: 30

  # Pulls the image, writes the logs and reads the secret; nothing the server itself does.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecretArn

  # What the server may do: the files bucket, when one is named, and nothing else.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies: !If
        - HasBucket
        - - PolicyName: files-bucket
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                  Resource: !Sub arn:aws:s3:::${FilesBucketName}/*
                # Without ListBucket a missing object answers 403 rather than 404.
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub arn:aws:s3:::${FilesBucketName}
        - !Ref AWS::NoValue

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ServiceName} load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ServiceName} tasks, reachable only from the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  # The load balancer appends the caller's address as the last X-Forwarded-For entry and sets
  # X-Forwarded-Proto, the same as Cloud Run's front end, so trustedProxyCount stays 1.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /actuator/health/readiness
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '15'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ServiceName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: !Ref ServiceName
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 8080 }]
          StopTimeout: 30
          Environment:
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_ISSUER, Value: !Ref Issuer }
          Secrets:
            - { Name: MONGODB_URI, ValueFrom: !Sub '${AppSecretArn}:MONGODB_URI::' }
            - { Name: BASE64_ENCRYPTION_KEY, ValueFrom: !Sub '${AppSecretArn}:BASE64_ENCRYPTION_KEY::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref MinTasks
      HealthCheckGracePeriodSeconds: 180
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: !Ref ServiceName
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${Service.Name}
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks

  CpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${ServiceName}-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlerts
    Properties:
      TopicName: !Sub ${ServiceName}-alerts
      Subscription: [{ Protocol: email, Endpoint: !Ref AlertEmail }]

  UnreachableAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlerts
    Properties:
      AlarmName: !Sub ${ServiceName} is unreachable
      AlarmDescription: No task is passing the load balancer's readiness check, so nobody can sign in. Check the service's events and logs.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      ComparisonOperator: LessThanThreshold
      Threshold: 1
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlerts
    Properties:
      AlarmName: !Sub ${ServiceName} is answering with server errors
      AlarmDescription: !Sub More than 10 responses with a 5xx status in five minutes. The logs in /ecs/${ServiceName} say which requests.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 10
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  MemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlerts
    Properties:
      AlarmName: !Sub ${ServiceName} is running out of memory
      AlarmDescription: A task has used more than 90% of its memory for five minutes. Past 100% ECS kills it, along with every sign-in it was serving.
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: !GetAtt Service.Name }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      ComparisonOperator: GreaterThanThreshold
      Threshold: 90
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  LoadBalancerDnsName:
    Description: Point the server's domain here (a CNAME, or an alias record on Route 53).
    Value: !GetAtt LoadBalancer.DNSName
