AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  komposeauth on AWS: ECS Fargate behind a load balancer, with an S3 bucket for profile photos,
  organization logos and KYC documents. Created and updated by scripts/deploy-aws.sh; see
  "AWS (ECS Fargate)" in README.md.

Parameters:
  ServiceName:
    Type: String
    Default: komposeauth
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      At least two public subnets in different zones. The load balancer and the tasks share them,
      and a task gets a public address so it can reach MongoDB Atlas and the SMS and email providers
      without a NAT gateway.
  CertificateArn:
    Type: String
    Description: ACM certificate for the domain the server answers on.
  AppSecretArn:
    Type: String
    Description: A Secrets Manager secret holding JSON with MONGODB_URI and BASE64_ENCRYPTION_KEY.
  ImageUri:
    Type: String
    Description: The image to run, pinned by digest (deploy-aws.sh resolves it).
  Cpu:
    Type: Number
    Default: 512
  Memory:
    Type: Number
    Default: 1024
  MinTasks:
    Type: Number
    Default: 1
  MaxTasks:
    Type: Number
    Default: 3
  AlertEmail:
    Type: String
    Default: ''
    Description: >-
      Where the two alarms below email. Empty creates none. AWS emails the address once to confirm
      the subscription before anything is delivered.

Conditions:
  HasAlerts: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ServiceName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ServiceName}
      RetentionInDays: 30

  # Set its name as s3BucketName, and the stack's region as s3Region, in the admin config page, and
  # storageProvider "s3" when a GCS bucket is configured too.
  # Photos and logos are shown straight from their address, so those two prefixes are readable by
  # anyone; KYC documents are identity papers and are not.
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ServiceName}-files-${AWS::AccountId}
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicPhotosAndLogos
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource:
              - !Sub arn:aws:s3:::${FilesBucket}/users/*
              - !Sub arn:aws:s3:::${FilesBucket}/organization_logos/*

  # Pulls the image, writes the logs and reads the secret; nothing the app itself does.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecretArn

  # What the server is allowed to do: the files bucket, and nothing else. With s3AccessKeyId left
  # empty in the config page the S3 client picks these credentials up from the task.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: files-bucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::${FilesBucket}/*
              # Without ListBucket a missing object answers 403 rather than 404.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${FilesBucket}

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ServiceName} load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ServiceName} tasks, reachable only from the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      # Green only once the migrations and warm-up are done (see application.yml).
      HealthCheckPath: /actuator/health/readiness
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        # A little over SHUTDOWN_GRACE_PERIOD below.
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ServiceName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: !Ref ServiceName
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 8080 }]
          StopTimeout: 30
          Environment:
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            # The load balancer appends the address it saw to X-Forwarded-For: one hop (README.md).
            - { Name: TRUSTED_PROXY_COUNT, Value: '1' }
            - { Name: BPL_JVM_THREAD_COUNT, Value: '100' }
            # Cloud Run allows 10s before SIGKILL; ECS allows StopTimeout.
            - { Name: SHUTDOWN_GRACE_PERIOD, Value: 25s }
          Secrets:
            - { Name: MONGODB_URI, ValueFrom: !Sub '${AppSecretArn}:MONGODB_URI::' }
            - { Name: BASE64_ENCRYPTION_KEY, ValueFrom: !Sub '${AppSecretArn}:BASE64_ENCRYPTION_KEY::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref MinTasks
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: !Ref ServiceName
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${Service.Name}
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks

  CpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${ServiceName}-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlerts
    Properties:
      TopicName: !Sub ${ServiceName}-alerts
      Subscription: [{ Protocol: email, Endpoint: !Ref AlertEmail }]

  UnreachableAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlerts
    Properties:
      AlarmName: !Sub ${ServiceName} has no healthy task
      AlarmDescription: Nobody can sign in. Check the service's events and /ecs logs.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      ComparisonOperator: LessThanThreshold
      Threshold: 1
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]

  ServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlerts
    Properties:
      AlarmName: !Sub ${ServiceName} is answering with server errors
      AlarmDescription: More than 10 responses of 500 or above in five minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 10
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  LoadBalancerDnsName:
    Description: Point the server's domain here (a CNAME, or an alias record on Route 53).
    Value: !GetAtt LoadBalancer.DNSName
  FilesBucketName:
    Description: Set as s3BucketName in the admin config page, with this stack's region as s3Region.
    Value: !Ref FilesBucket
